<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявки учебной кампании</title><style>body{font:16px/1.5 system-ui;color:#172f38;background:#f6f7f4;max-width:920px;margin:5vh auto;padding:18px}h1{font-size:2rem}select{padding:6px;margin:0 18px 12px 4px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:9px;text-align:left;border-bottom:1px solid #c5d1d0}output{display:block;margin:12px 0;font-size:1.2rem;font-weight:600}</style><h1>Заявки учебной кампании</h1><p>Выгрузка v2 · 23–24 сентября 2026 г. и записи с ошибкой даты.</p><div id="filters"></div><output id="summary"></output><table><thead><tr><th>Дата</th><th>Источник</th><th>Кампания</th><th>Заявки</th><th>Выполнены</th></tr></thead><tbody></tbody></table><p>Сеансы и события GA4 недоступны. Количество заявок рассчитано по уникальным ID.</p><script>const rows=[{"request_id": "REQ-001", "created_at": "2026-09-23 12:40:00", "utm_source": "telegram", "utm_campaign": "lesson07", "status": "new"}, {"request_id": "REQ-002", "created_at": "2026-09-23 12:44:00", "utm_source": "vk", "utm_campaign": "lesson07", "status": "new"}, {"request_id": "REQ-003", "created_at": "#VALUE!", "utm_source": "telegram", "utm_campaign": "lesson07", "status": "done"}, {"request_id": "REQ-004", "created_at": "2026-09-23 13:01:00", "utm_source": "direct", "utm_campaign": "not_set", "status": "new"}, {"request_id": "REQ-005", "created_at": "2026-09-23 13:05:00", "utm_source": "telegram", "utm_campaign": "lesson07", "status": "done"}, {"request_id": "REQ-006", "created_at": "2026-09-24 09:10:00", "utm_source": "telegram", "utm_campaign": "lesson08", "status": "new"}, {"request_id": "REQ-007", "created_at": "2026-09-24 09:20:00", "utm_source": "vk", "utm_campaign": "lesson08", "status": "done"}, {"request_id": "REQ-008", "created_at": "#VALUE!", "utm_source": "telegram", "utm_campaign": "lesson08", "status": "new"}];rows.forEach(r=>r.day=r.created_at==='#VALUE!'?'Ошибка даты':r.created_at.slice(0,10)); const fields={day:'Дата',utm_source:'Источник',utm_campaign:'Кампания',status:'Статус'},filters=document.querySelector('#filters'); for(const [key,title] of Object.entries(fields)){const label=document.createElement('label'),sel=document.createElement('select');label.textContent=title;sel.name=key;sel.add(new Option('Все',''));for(const v of new Set(rows.map(r=>r[key])))sel.add(new Option(v,v));label.append(sel);filters.append(label);sel.onchange=render;}function render(){const selected=rows.filter(r=>[...document.querySelectorAll('select')].every(s=>!s.value||r[s.name]===s.value));const groups=new Map();for(const r of selected){const key=[r.day,r.utm_source,r.utm_campaign].join('|');if(!groups.has(key))groups.set(key,[new Set(),new Set()]);const g=groups.get(key);g[0].add(r.request_id);if(r.status==='done')g[1].add(r.request_id)}document.querySelector('#summary').textContent='Уникальные заявки: '+new Set(selected.map(r=>r.request_id)).size;let tbody=document.querySelector('tbody');tbody.replaceChildren();for(const [key,v] of [...groups].sort()){let tr=tbody.insertRow();for(const val of [...key.split('|'),v[0].size,v[1].size])tr.insertCell().textContent=val}}render()</script></html>
